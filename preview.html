<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday Babe!</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#ff9a9e,#fad0c4);
text-align:center;
padding:40px;
color:#333;
overflow-x:hidden;
}

.card{
background:white;
padding:30px;
border-radius:15px;
max-width:600px;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

button{
padding:12px 20px;
font-size:16px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
margin-right:5px;
}

#surprise{
display:none;
margin-top:20px;
font-size:20px;
}

#videoSection{
display:none;
margin-top:30px;
}

#audioSection{
display:none;
margin-top:20px;
}

.heart{
position:fixed;
font-size:28px;
pointer-events:none;
}

</style>
</head>

<body>

<div class="card">

<h1>Happy Birthday, Babe! ❤️</h1>
<p>To the most amazing person in my life.</p>

<button onclick="showMessage()">Open Your Surprise</button>

<div id="surprise">

<p>I love you so much. Thank you for being in my life.</p>

<p>Question for you:</p>
<p>Will you go on a birthday date with me? 🎂</p>

<div id="buttons">
<button onclick="answerYes()">Yes</button>
<button onclick="answerNo()">No</button>
</div>

<p id="response"></p>

<div id="videoSection">

<h3>One more surprise for you ❤️</h3>

<iframe
width="100%"
height="315"
src="https://drive.google.com/file/d/19hOBRvdp3IgHAl36wRcy5616FF8oYote/preview"
allow="autoplay"
allowfullscreen>
</iframe>

<br>

<button onclick="showAudio()">I finished watching</button>

</div>

<div id="audioSection">

<p><b>Hindi na pala QR, just wear earphones or headset para clear mo marinig.</b></p>

<iframe
width="100%"
height="80"
src="https://drive.google.com/file/d/1b1f9_RPBUc_2bAzWJ6cyXlIcToGsYwgc/preview"
allow="autoplay">
</iframe>

</div>

</div>

</div>

<script>

let noCount = 0;

function showMessage(){
document.getElementById("surprise").style.display="block";
}

function answerYes(){

document.getElementById("response").innerHTML =
"Yay! I knew you'd say yes ❤️";

startHearts();

setTimeout(()=>{
document.getElementById("videoSection").style.display="block";
},3000);

}

function answerNo(){

noCount++;

if(noCount === 1){

document.getElementById("response").innerHTML =
"Why naman nag NO, bawal yan 😭";

document.getElementById("buttons").innerHTML =
'<button onclick="answerYes()">Yes</button>' +
'<button onclick="answerNo()">No</button>';

}

else if(noCount === 2){

document.getElementById("response").innerHTML =
"Last time na to babe, bawal na mag NO!";

document.getElementById("buttons").innerHTML =
'<button onclick="answerYes()">Yes</button>' +
'<button onclick="answerYes()">Yes</button>';

}

}

function showAudio(){
document.getElementById("audioSection").style.display="block";
}

function startHearts(){

for(let i=0;i<35;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.top=Math.random()*100+"vh";

document.body.appendChild(heart);

let x=(Math.random()*200)-100;
let y=(Math.random()*200)-100;

heart.animate([
{transform:"translate(0,0)",opacity:1},
{transform:`translate(${x}px,${y}px)`,opacity:0}
],{
duration:2000+Math.random()*2000,
easing:"ease-out"
});

setTimeout(()=>{heart.remove()},3500);

}

}

</script>

</body>
</html>
